name: Apply wave1 deterministic repairs

on:
  push:
    branches:
      - parallel/freya-parity-integration-wave1
    paths:
      - .github/workflows/bootstrap-wave1-fixer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/freya-parity-integration-wave1
          fetch-depth: 0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def replace_all_exact(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              write(path, text.replace(old, new))

          replace_once('build/scripts/test-official-addon-packs.mjs', 'const { state, api, browserWindow } = runtime', 'const { state, browserWindow } = runtime')
          replace_once('migration/freya/differential-scenarios.json', '"source": "Elephant/freya/src/app/navigation.rs#rail_action",', '"implementationSource": "Elephant/freya/src/app/navigation.rs#rail_action",')

          for path, expected in [
              ('tests/app/e2e/addon-ui/local-runtime/real-local-runtime.spec.js', 3),
              ('tests/app/e2e/addon-ui/real-sync/real-sync-service.spec.js', 1),
              ('tests/app/e2e/example-addon-ui-usage.spec.js', 1),
          ]:
              replace_all_exact(path, 'async ({}, testInfo) => {', 'async (fixtures, testInfo) => {\n  void fixtures', expected)

          replace_once('tests/app/e2e/example-addon-ui-usage.spec.js', "const path = require('node:path')\n", '')
          replace_once('tests/app/e2e/example-addon-ui/tauri-harness.js', "const runVisibleCommand = async (app, title) => {\n  await app.command('click', `.en-addon-detail-commands button`)\n  await waitForText(app, '.en-addons-feedback', 'completed', 60000)\n  return title\n}\n\n", '')
          replace_once('tools/freya-differential/orchestrate.mjs', "import { expectedActions, loadScenario, materializeFixture, validateScenario } from './lib/scenario.mjs'", "import { loadScenario, materializeFixture, validateScenario } from './lib/scenario.mjs'")
          replace_once('tools/freya-differential/tests/fixtures/capture-command.mjs', '  const checkpointDir = path.join(output, action.checkpoint)\n', '')
          replace_once('tools/playwright-source-visual-capture/renderer.mjs', '  const { app, page } = launched', '  const { page } = launched')
          replace_once('tools/tauri-visual-capture/fixture.mjs', "import { existsSync, mkdirSync, mkdtempSync, readFileSync, readdirSync, realpathSync, writeFileSync } from 'node:fs'", "import { existsSync, mkdirSync, mkdtempSync, readFileSync, readdirSync, realpathSync } from 'node:fs'")
          replace_once('tools/tauri-visual-capture/index.mjs', "import { mkdirSync, rmSync, writeFileSync } from 'node:fs'", "import { rmSync } from 'node:fs'")
          replace_once('tools/tauri-visual-capture/index.mjs', "import { listNativeWindows, setWindowGeometry } from './native-window.mjs'", "import { setWindowGeometry } from './native-window.mjs'")
          replace_once('tools/tauri-visual-capture/native-window.mjs', "import { execFileSync, spawnSync } from 'node:child_process'", "import { spawnSync } from 'node:child_process'")
          replace_once('tools/tauri-wdio-embedded/runtime.mjs', "import { mkdir, readFile, readdir, stat, writeFile } from 'node:fs/promises'", "import { mkdir, readFile, readdir, writeFile } from 'node:fs/promises'")
          replace_once('tools/tauri-wdio-embedded/runtime.mjs', "  const editor = await optional('.en-editor-host .editor-component, .en-note-editor-shell')\n", '')
          replace_once('tools/tauri-wdio-embedded/tests/differential.e2e.mjs', "import { expectedActions, expectedCheckpoints, loadScenario } from '../../../tools/freya-differential/lib/scenario.mjs'", "import { expectedActions, loadScenario } from '../../../tools/freya-differential/lib/scenario.mjs'")
          replace_once('tools/tauri-wdio-embedded/tests/differential.e2e.mjs', "import { byText, captureFrame, displayed, railOrder, requireElement, sleep, snapshotVault, stateSnapshot, visibleByText, writeJson } from '../runtime.mjs'", "import { captureFrame, railOrder, requireElement, sleep, snapshotVault, stateSnapshot, visibleByText, writeJson } from '../runtime.mjs'")
          replace_once('tools/tauri-wdio-embedded/tests/differential.e2e.mjs', 'const checkpoints = expectedCheckpoints(scenario)\n', '')
          replace_once('tools/tauri-wdio-embedded/wdio.conf.mjs', "import { mkdir, mkdtemp, stat } from 'node:fs/promises'", "import { mkdir, mkdtemp } from 'node:fs/promises'")

          ast = read('tools/vue-to-freya/ast.mjs')
          ast, count = re.subn(r"\nfunction attr\(node, name\) \{\n  return node\.props\?\.find\(\(prop\) => prop\.type === NodeTypes\.ATTRIBUTE && prop\.name === name\)\n\}\n", '\n', ast, count=1)
          if count != 1:
              raise SystemExit(f'tools/vue-to-freya/ast.mjs: attr helper removal count={count}')
          write('tools/vue-to-freya/ast.mjs', ast)

          sync_path = 'tests/app/e2e/addon-ui/real-sync/real-sync-service.js'
          sync = read(sync_path)
          old_decl = "  let scenarioError = null\n  let cleanup = {}\n  let pairing = null\n  const transfers = []\n"
          new_decl = "  let scenarioError = null\n  let cleanup = {}\n  let pairing = null\n  let artifact = null\n  const transfers = []\n"
          if sync.count(old_decl) != 1:
              raise SystemExit('real-sync-service.js: declaration anchor mismatch')
          sync = sync.replace(old_decl, new_decl, 1)
          old_tail = """    const artifact = {
      success: !scenarioError && cleanup.a.clean && cleanup.b.clean && cleanup.vaultsRemoved,
      binary: { path: binary.path, source: binary.source, sha256: sha256(binary.path) },
      pairing,
      transfers,
      cleanup,
      events,
      processes: processSnapshots
    }
    fs.mkdirSync(path.dirname(artifactPath), { recursive: true })
    fs.writeFileSync(artifactPath, `${JSON.stringify(artifact, null, 2)}\n`, 'utf8')
    if (scenarioError) throw new Error(`${scenarioError.message} (artifact: ${artifactPath})`)
    assert.equal(cleanup.a.clean, true, 'device A service must exit cleanly after service.stop')
    assert.equal(cleanup.b.clean, true, 'device B service must exit cleanly after service.stop')
    assert.equal(cleanup.processesExited, true, 'both real service processes must exit')
    assert.equal(cleanup.vaultsRemoved, true, 'temporary vaults must be removed')
    return artifact
  }
}"""
          new_tail = """    artifact = {
      success: !scenarioError && cleanup.a.clean && cleanup.b.clean && cleanup.vaultsRemoved,
      binary: { path: binary.path, source: binary.source, sha256: sha256(binary.path) },
      pairing,
      transfers,
      cleanup,
      events,
      processes: processSnapshots
    }
    fs.mkdirSync(path.dirname(artifactPath), { recursive: true })
    fs.writeFileSync(artifactPath, `${JSON.stringify(artifact, null, 2)}\n`, 'utf8')
  }
  if (scenarioError) throw new Error(`${scenarioError.message} (artifact: ${artifactPath})`)
  assert.equal(cleanup.a.clean, true, 'device A service must exit cleanly after service.stop')
  assert.equal(cleanup.b.clean, true, 'device B service must exit cleanly after service.stop')
  assert.equal(cleanup.processesExited, true, 'both real service processes must exit')
  assert.equal(cleanup.vaultsRemoved, true, 'temporary vaults must be removed')
  return artifact
}"""
          if sync.count(old_tail) != 1:
              raise SystemExit('real-sync-service.js: finally tail anchor mismatch')
          write(sync_path, sync.replace(old_tail, new_tail, 1))

          replace_once('Elephant/frontend/app/components/settings/SettingsPanel.vue', '              <span v-if="activeSection === \'addons\'" id="en-addons-title-actions" class="en-settings-title-actions" />\n', '')

          ownership = """import fs from 'node:fs'
import path from 'node:path'
import { describe, expect, it } from 'vitest'

const root = process.cwd()
const read = (file) => fs.readFileSync(path.join(root, file), 'utf8')

describe('Muya Rust editor production ownership', () => {
  it('uses the Rust runtime at the real editor-with-tabs boundary', () => {
    const tabs = read('Elephant/frontend/src/renderer/src/components/editorWithTabs/index.vue')
    const runtime = read('Elephant/frontend/src/renderer/src/components/editorWithTabs/runtimeEditor.vue')
    expect(tabs).toContain("import RuntimeEditor from './runtimeEditor.vue'")
    expect(tabs).not.toContain("import Editor from './editor.vue'")
    expect(runtime).toContain("import { RustMuyaRuntimeEditor } from '@/muya'")
    expect(runtime).toContain("import { createRustEditorRuntimeBinding } from '@/muya/editorRuntimeResource'")
    expect(runtime).toContain('<RustMuyaRuntimeEditor')
    expect(runtime).not.toContain("import Muya from 'muya/lib'")
    expect(runtime).not.toContain('new Muya(')
    expect(runtime).not.toContain('CodeMirror')
  })

  it('builds and aliases the Rust WASM runtime in production web commands', () => {
    const vite = read('vite.tauri.config.mjs')
    const packageJson = JSON.parse(read('package.json'))
    expect(vite).toContain("'muya-rust-wasm-bundle': muyaWasmGenerated")
    expect(packageJson.scripts['tauri:web:build']).toContain('pnpm muya:wasm:build')
    expect(packageJson.scripts['tauri:web:dev']).toContain('pnpm muya:wasm:build')
  })
})
"""
          write('tests/app/unit/specs/muya/rustProductionOwnership.spec.js', ownership)

          android_path = 'tests/app/unit/specs/main/elephantnote/androidReleaseRecovery.spec.js'
          android = read(android_path)
          old = """    expect(runtimeEditor).toContain("import Muya from 'muya/lib'")
    expect(runtimeEditor).toContain('editor.value = new Muya(ele, options)')
"""
          new = """    expect(runtimeEditor).toContain("import { RustMuyaRuntimeEditor } from '@/muya'")
    expect(runtimeEditor).toContain("import { createRustEditorRuntimeBinding } from '@/muya/editorRuntimeResource'")
    expect(runtimeEditor).not.toContain("import Muya from 'muya/lib'")
    expect(runtimeEditor).not.toContain('new Muya(')
"""
          if android.count(old) != 1:
              raise SystemExit('androidReleaseRecovery.spec.js: legacy Muya expectation anchor mismatch')
          write(android_path, android.replace(old, new, 1))
          PY
      - name: Validate lint
        run: pnpm lint
      - name: Validate targeted ownership/settings tests
        run: >-
          pnpm exec vitest run
          tests/app/unit/specs/muya/rustProductionOwnership.spec.js
          tests/app/unit/specs/main/elephantnote/androidReleaseRecovery.spec.js
          tests/app/unit/specs/main/elephantnote/settingsRedesign.spec.js
      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build migration Elephant tests tools
          git diff --cached --check
          git commit -m "fix(ci): apply deterministic wave1 repairs"
          git push origin HEAD:parallel/freya-parity-integration-wave1
