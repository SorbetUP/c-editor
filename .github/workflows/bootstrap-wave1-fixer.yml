name: Apply wave1 deterministic repairs

on:
  push:
    branches:
      - parallel/freya-parity-integration-wave1
    paths:
      - .github/workflows/bootstrap-wave1-fixer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/freya-parity-integration-wave1
          fetch-depth: 0
      - name: Apply deterministic repairs
        run: python3 tools/ci-wave1-repair.py
      - name: Commit repaired sources
        shell: bash
        run: |
          rm tools/ci-wave1-repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build migration Elephant tests tools
          git diff --cached --check
          git commit -m "fix(ci): apply deterministic wave1 repairs"
          git push origin HEAD:parallel/freya-parity-integration-wave1
