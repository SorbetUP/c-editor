name: Freya native shell

on:
  push:
    branches:
      - nsb/freya-native-migration
  pull_request:
    paths:
      - "Elephant/freya/**"
      - "Elephant/crates/muya-core/**"
      - "Elephant/frontend/**"
      - "Elephant/backend/knowledge-core/**"
      - "Elephant/backend/tauri/**"
      - "migration/freya/**"
      - "tools/freya-differential/**"
      - "tools/tauri-visual-capture/**"
      - "tools/tauri-wdio-embedded/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/actions/setup/**"
      - ".github/workflows/freya-native.yml"

permissions:
  contents: read

jobs:
  check-and-test:
    name: Freya check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype6-dev libfontconfig1-dev libegl-dev libwayland-dev libgles-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya shell
        run: cargo check --manifest-path Elephant/freya/Cargo.toml

      - name: Compile Freya library tests
        shell: bash
        env:
          RUST_BACKTRACE: full
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          log=/tmp/freya-lib-compile.log
          set +e
          timeout 180 cargo test --verbose --manifest-path Elephant/freya/Cargo.toml --lib --no-run 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            diagnostic=/tmp/freya-lib-compile-diagnostic.log
            grep -nE -B5 -A15 'error\[E[0-9]+\]|error:|could not compile|linking with|undefined reference|collect2:|ld:|signal:|SIG[A-Z]+|killed|No such file|not found|fatal error|cc:|clang:' "$log" | tail -n 400 > "$diagnostic" || true
            if [ ! -s "$diagnostic" ]; then
              tail -n 120 "$log" > "$diagnostic"
            fi
            echo "::group::Freya library compile/link diagnostic"
            cat "$diagnostic"
            echo "::endgroup::"
            count=0
            while IFS= read -r line && [ "$count" -lt 80 ]; do
              [ -z "$line" ] && continue
              escaped="${line//%/%25}"
              escaped="${escaped//$'\r'/%0D}"
              echo "::error title=Freya compile detail $((count + 1))::$escaped"
              count=$((count + 1))
            done < "$diagnostic"
            {
              echo "## Freya library test compilation failed"
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              cat "$diagnostic"
              echo '```'
              echo
              echo "### Tail of complete Cargo output"
              echo '```text'
              tail -n 250 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Freya library test compilation failed::cargo test --lib --no-run exited with status $status. Compiler/linker diagnostics are exposed as annotations above."
            exit "$status"
          fi

      - name: List Freya library tests
        shell: bash
        env:
          RUST_BACKTRACE: full
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          log=/tmp/freya-lib-list.log
          set +e
          timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --lib -- --list 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Freya library test harness/list diagnostic"
            grep -nE -B5 -A15 'error\[E[0-9]+\]|error:|panicked at|FAILED|failures:|thread .* panicked|signal:|SIG[A-Z]+|killed|No such file|not found' "$log" | tail -n 400 || true
            echo "::endgroup::"
            {
              echo "## Freya library test listing failed"
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              tail -n 400 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Freya library test listing failed::cargo test --lib -- --list exited with status $status. See the diagnostic group and job summary."
            exit "$status"
          fi

      - name: Run Freya library tests
        shell: bash
        env:
          RUST_BACKTRACE: full
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          log=/tmp/freya-lib-run.log
          set +e
          timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --lib -- --test-threads=1 --nocapture 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Freya library runtime diagnostic"
            grep -nE -B6 -A18 'test .* \.\.\. FAILED|panicked at|thread .* panicked|failures:|test result: FAILED|assertion|Error:|error:|signal:|SIG[A-Z]+|killed|timeout' "$log" | tail -n 500 || true
            echo "::endgroup::"
            {
              echo "## Freya library test execution failed"
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              tail -n 500 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Freya library test execution failed::cargo test --lib exited with status $status. See the diagnostic group and job summary."
            exit "$status"
          fi

      - name: Test Freya integration suites independently
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for file in Elephant/freya/tests/*.rs; do
            suite="$(basename "$file" .rs)"
            if [ "$suite" = "differential_freya_capture" ]; then
              echo "::notice title=Freya differential capture::${suite} is executed below with the shared seeded differential fixture and runtime contract."
              continue
            fi
            echo "::group::Freya suite: $suite"
            set +e
            timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --test "$suite" -- --test-threads=1 2>&1 | tee "/tmp/freya-${suite}.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              if [ "$status" -eq 124 ]; then
                detail="suite timed out after 180 seconds"
              else
                detail="suite exited with status $status"
              fi
              python3 - "$suite" "$detail" "/tmp/freya-${suite}.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          suite, detail, filename = sys.argv[1:]
          raw = Path(filename).read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          lines = [ansi.sub('', line) for line in raw.splitlines()]
          markers = (
              ' FAILED', 'panicked at', 'failures:', 'test result: FAILED',
              'NotFound', 'assertion ', 'Error:', 'error[E', 'error:'
          )
          interesting = []
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  interesting.extend(lines[max(0, index - 2):min(len(lines), index + 5)])
          if not interesting:
              interesting = lines[-30:]
          compact = []
          seen = set()
          for line in interesting:
              if line not in seen:
                  compact.append(line)
                  seen.add(line)
          message = detail + '\n' + '\n'.join(compact[-60:])
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Freya suite {suite}::{escaped}')
          PY
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "Freya integration failures: $failures"
            exit 1
          fi

      - name: Run seeded Freya differential capture journey
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/freya-differential-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fixture="$root/fixture"
          output="$root/output"
          rm -rf "$root"
          mkdir -p "$fixture" "$output"
          viewport_json=
          viewport_json="$(node --input-type=module - "$fixture" <<'NODE'
          import path from 'node:path'
          import { loadScenario, materializeFixture } from './tools/freya-differential/lib/scenario.mjs'
          const fixtureRoot = process.argv[2]
          const scenarioPath = path.resolve('migration/freya/differential-scenarios.json')
          const scenario = await loadScenario(scenarioPath)
          await materializeFixture(scenario, fixtureRoot)
          process.stdout.write(JSON.stringify(scenario.viewport))
          NODE
          )"
          export DIFFERENTIAL_RUNTIME=freya
          export DIFFERENTIAL_SCENARIO_PATH="$GITHUB_WORKSPACE/migration/freya/differential-scenarios.json"
          export DIFFERENTIAL_OUTPUT_DIR="$output"
          export DIFFERENTIAL_FIXTURE_ROOT="$fixture"
          export DIFFERENTIAL_EXPECTED_VIEWPORT_JSON="$viewport_json"
          export DIFFERENTIAL_RUN_ID="freya-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          differential_command_sha256="$(printf '%s' 'cargo test --manifest-path Elephant/freya/Cargo.toml --test differential_freya_capture -- --test-threads=1 --nocapture' | sha256sum | cut -d' ' -f1)"
          export DIFFERENTIAL_COMMAND_SHA256="$differential_command_sha256"
          export DIFFERENTIAL_CAPTURE_NONCE="freya-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --test differential_freya_capture -- --test-threads=1 --nocapture
          test -s "$output/manifest.json"

  macos-check:
    name: Freya macOS compile
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya shell and native vault dialog on macOS
        run: cargo check --manifest-path Elephant/freya/Cargo.toml

  differential-comparison:
    name: Default Tauri / Freya differential
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install workspace dependencies
        uses: ./.github/actions/setup

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/backend/tauri -> target
            Elephant/freya -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.10.0' --locked

      - name: Install wasm-bindgen CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --manifest-path Elephant/crates/muya-wasm/Cargo.toml --format-version 1 \
            | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(p['version'] for p in data['packages'] if p['name']=='wasm-bindgen'))")"
          if ! wasm-bindgen --version 2>/dev/null | grep -q "${version}$"; then
            cargo install wasm-bindgen-cli --version "${version}" --locked
          fi
          wasm-bindgen --version

      - name: Install Tauri WebDriver runner
        run: pnpm --dir tools/tauri-wdio-embedded --ignore-workspace install --frozen-lockfile

      - name: Build Default Tauri acceptance binary
        shell: bash
        run: |
          set -euo pipefail
          cd Elephant/backend/tauri
          cargo tauri build --debug --no-bundle --features acceptance-wdio --config tauri.wdio.conf.json 2>&1 | tee ../../../tauri-wdio-build.log
          test -x target/debug/Elephant

      - name: Compare Default Tauri and Freya journeys
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/test-results/freya-differential-orchestrated"
          rm -rf "$root"
          mkdir -p "$root"
          tauri_command='pnpm --dir tools/tauri-wdio-embedded --ignore-workspace exec wdio run wdio.conf.mjs'
          freya_command='cargo test --manifest-path Elephant/freya/Cargo.toml --test differential_freya_capture -- --test-threads=1 --nocapture'
          node tools/freya-differential/orchestrate.mjs \
            --tauri-command "$tauri_command" \
            --freya-command "$freya_command" \
            --scenario migration/freya/differential-scenarios.json \
            --output "$root" \
            --timeout-ms 600000
          node --input-type=module - "$root" <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const root = process.argv[2]
          const report = JSON.parse(fs.readFileSync(path.join(root, 'orchestration-report.json'), 'utf8'))
          const comparison = report.comparison ?? {}
          const comparisons = Array.isArray(comparison.comparisons) ? comparison.comparisons : []
          const maxChangedPixelRatio = comparisons.reduce((max, item) => Math.max(max, Number(item.pixels?.differentRatio ?? 0)), 0)
          const differentFrames = comparisons.filter((item) => item.status !== 'passed' && item.status !== 'passed-byte-identical').length
          const summary = [
            '## Default Tauri / Freya differential',
            '',
            `- Status: **${report.status}**`,
            `- Actions: ${report.summary?.actions?.compared ?? 0}/${report.summary?.actions?.expected ?? 0}`,
            `- Compared frames: ${report.summary?.frames?.compared ?? comparison.summary?.files?.compared ?? 0}`,
            `- Different frames: ${differentFrames}`,
            `- Max changed-pixel ratio: ${maxChangedPixelRatio}`,
            `- Evidence: uploaded in the workflow artifact under \`${root}\``,
          ]
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\\n')}\\n`)
          if (report.status !== 'ok') {
            throw new Error(`Differential orchestration status was ${report.status}`)
          }
          NODE

      - name: Upload Default Tauri / Freya evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freya-default-differential-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/freya-differential-orchestrated/**
            tauri-wdio-build.log
          if-no-files-found: warn
          retention-days: 30
