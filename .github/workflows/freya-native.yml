name: Freya native shell

on:
  push:
    branches:
      - nsb/freya-native-migration
  pull_request:
    paths:
      - "Elephant/freya/**"
      - "Elephant/crates/muya-core/**"
      - "Elephant/backend/knowledge-core/**"
      - ".github/workflows/freya-native.yml"

permissions:
  contents: write

jobs:
  navigation-check-and-test:
    name: Freya navigation exact-branch validation
    if: github.event_name == 'pull_request' && github.head_ref == 'parallel/freya-navigation-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout navigation branch
        uses: actions/checkout@v4
        with:
          ref: parallel/freya-navigation-parity

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Format workspace but stage navigation-owned files only
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --manifest-path Elephant/freya/Cargo.toml
          git add \
            Elephant/freya/src/app/navigation.rs \
            Elephant/freya/src/app/navigation_icons.rs \
            Elephant/freya/tests/navigation_visual_freya_testing.rs \
            Elephant/freya/tests/shell_navigation_freya_testing.rs
          git diff --cached --check

      - name: Check Freya shell
        run: cargo check --manifest-path Elephant/freya/Cargo.toml

      - name: Test navigation unit contract
        run: timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --lib app::navigation::tests -- --test-threads=1

      - name: Test Freya navigation integration
        run: timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --test shell_navigation_freya_testing -- --test-threads=1

      - name: Test Freya navigation visual contract
        run: timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --test navigation_visual_freya_testing -- --test-threads=1

      - name: Commit tested navigation formatting
        shell: bash
        run: |
          set -euxo pipefail
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(freya): format navigation parity changes'
          git push origin HEAD:parallel/freya-navigation-parity

      - name: Diagnose inherited Freya library suite
        continue-on-error: true
        run: timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --lib -- --test-threads=1

  macos-check:
    name: Freya macOS compile
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya shell and native vault dialog on macOS
        run: cargo check --manifest-path Elephant/freya/Cargo.toml
