name: Freya native shell

on:
  push:
    branches:
      - nsb/freya-native-migration
  pull_request:
    paths:
      - "Elephant/freya/**"
      - "Elephant/crates/muya-core/**"
      - "Elephant/backend/knowledge-core/**"
      - ".github/workflows/freya-native.yml"

permissions:
  contents: write

jobs:
  navigation-autofix:
    name: Freya navigation surgical API fix
    if: github.event_name == 'pull_request' && github.head_ref == 'parallel/freya-navigation-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout navigation branch
        uses: actions/checkout@v4
        with:
          ref: parallel/freya-navigation-parity

      - name: Replace unsupported global pointer-up handlers
        shell: python
        run: |
          from pathlib import Path
          path = Path('Elephant/freya/src/app/navigation.rs')
          source = path.read_text()
          old = '.on_global_pointer_up('
          count = source.count(old)
          if count not in (0, 2):
              raise SystemExit(f'expected 0 or 2 {old!r} occurrences, found {count}')
          if count:
              path.write_text(source.replace(old, '.on_global_pointer_press('))

      - name: Commit surgical API correction when needed
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Elephant/freya/src/app/navigation.rs
          git commit -m 'fix(freya): use global pointer press for drag release'
          git push origin HEAD:parallel/freya-navigation-parity

  check-and-test:
    name: Freya check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya formatting
        run: cargo fmt --manifest-path Elephant/freya/Cargo.toml -- --check

      - name: Check Freya shell
        run: cargo check --manifest-path Elephant/freya/Cargo.toml

      - name: Test Freya navigation integration
        run: timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --test shell_navigation_freya_testing -- --test-threads=1

      - name: Test Freya navigation visual contract
        run: timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --test navigation_visual_freya_testing -- --test-threads=1

      - name: Test Freya library
        run: timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --lib -- --test-threads=1

      - name: Test Freya integration suites independently
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for file in Elephant/freya/tests/*.rs; do
            suite="$(basename "$file" .rs)"
            echo "::group::Freya suite: $suite"
            set +e
            timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --test "$suite" -- --test-threads=1 2>&1 | tee "/tmp/freya-${suite}.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              if [ "$status" -eq 124 ]; then
                detail="suite timed out after 180 seconds"
              else
                detail="suite exited with status $status"
              fi
              python3 - "$suite" "$detail" "/tmp/freya-${suite}.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          suite, detail, filename = sys.argv[1:]
          raw = Path(filename).read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          lines = [ansi.sub('', line) for line in raw.splitlines()]
          markers = (
              ' FAILED', 'panicked at', 'failures:', 'test result: FAILED',
              'NotFound', 'assertion ', 'Error:', 'error[E', 'error:'
          )
          interesting = []
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  interesting.extend(lines[max(0, index - 2):min(len(lines), index + 5)])
          if not interesting:
              interesting = lines[-30:]
          compact = []
          seen = set()
          for line in interesting:
              if line not in seen:
                  compact.append(line)
                  seen.add(line)
          message = detail + '\n' + '\n'.join(compact[-60:])
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Freya suite {suite}::{escaped}')
          PY
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "Freya integration failures: $failures"
            exit 1
          fi

  macos-check:
    name: Freya macOS compile
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya shell and native vault dialog on macOS
        run: cargo check --manifest-path Elephant/freya/Cargo.toml
