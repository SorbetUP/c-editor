name: Freya native shell

on:
  push:
    branches:
      - nsb/freya-native-migration
  pull_request:
    paths:
      - "Elephant/freya/**"
      - "Elephant/crates/muya-core/**"
      - "Elephant/backend/knowledge-core/**"
      - ".github/workflows/freya-native.yml"

permissions:
  contents: read

jobs:
  check-and-test:
    name: Freya check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya shell
        run: cargo check --manifest-path Elephant/freya/Cargo.toml

      - name: Test Freya shell
        shell: bash
        run: |
          set +e
          cargo test --manifest-path Elephant/freya/Cargo.toml -- --test-threads=1 2>&1 | tee /tmp/freya-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          raw = Path('/tmp/freya-tests.log').read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          lines = [ansi.sub('', line) for line in raw.splitlines()]
          interesting = []
          markers = (
              ' FAILED', 'panicked at', 'failures:', 'test result: FAILED',
              'NotFound', 'assertion ', 'Error:', 'error[E', 'error:'
          )
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  start = max(0, index - 2)
                  end = min(len(lines), index + 4)
                  interesting.extend(lines[start:end])
          if not interesting:
              interesting = lines[-40:]
          # Preserve order while removing duplicate context lines.
          compact = []
          seen = set()
          for line in interesting:
              if line not in seen:
                  compact.append(line)
                  seen.add(line)
          message = '\n'.join(compact[-80:])
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Freya test failure::{escaped}')
          PY
          fi
          exit "$status"
