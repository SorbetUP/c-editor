name: Freya native shell

on:
  push:
    branches:
      - nsb/freya-native-migration
  pull_request:
    paths:
      - "Elephant/freya/**"
      - "Elephant/crates/muya-core/**"
      - "Elephant/backend/knowledge-core/**"
      - ".github/workflows/freya-native.yml"

permissions:
  contents: read

jobs:
  check-and-test:
    name: Freya check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype6-dev libfontconfig1-dev libegl-dev libwayland-dev libgles-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya shell
        run: cargo check --manifest-path Elephant/freya/Cargo.toml

      - name: Compile Freya library tests
        shell: bash
        env:
          RUST_BACKTRACE: full
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          log=/tmp/freya-lib-compile.log
          set +e
          timeout 180 cargo test --verbose --manifest-path Elephant/freya/Cargo.toml --lib --no-run 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            diagnostic=/tmp/freya-lib-compile-diagnostic.log
            grep -nE -B5 -A15 'error\[E[0-9]+\]|error:|could not compile|linking with|undefined reference|collect2:|ld:|signal:|SIG[A-Z]+|killed|No such file|not found|fatal error|cc:|clang:' "$log" | tail -n 400 > "$diagnostic" || true
            if [ ! -s "$diagnostic" ]; then
              tail -n 120 "$log" > "$diagnostic"
            fi
            echo "::group::Freya library compile/link diagnostic"
            cat "$diagnostic"
            echo "::endgroup::"
            count=0
            while IFS= read -r line && [ "$count" -lt 80 ]; do
              [ -z "$line" ] && continue
              escaped="${line//%/%25}"
              escaped="${escaped//$'\r'/%0D}"
              echo "::error title=Freya compile detail $((count + 1))::$escaped"
              count=$((count + 1))
            done < "$diagnostic"
            {
              echo "## Freya library test compilation failed"
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              cat "$diagnostic"
              echo '```'
              echo
              echo "### Tail of complete Cargo output"
              echo '```text'
              tail -n 250 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Freya library test compilation failed::cargo test --lib --no-run exited with status $status. Compiler/linker diagnostics are exposed as annotations above."
            exit "$status"
          fi

      - name: List Freya library tests
        shell: bash
        env:
          RUST_BACKTRACE: full
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          log=/tmp/freya-lib-list.log
          set +e
          timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --lib -- --list 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Freya library test harness/list diagnostic"
            grep -nE -B5 -A15 'error\[E[0-9]+\]|error:|panicked at|FAILED|failures:|thread .* panicked|signal:|SIG[A-Z]+|killed|No such file|not found' "$log" | tail -n 400 || true
            echo "::endgroup::"
            {
              echo "## Freya library test listing failed"
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              tail -n 400 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Freya library test listing failed::cargo test --lib -- --list exited with status $status. See the diagnostic group and job summary."
            exit "$status"
          fi

      - name: Run Freya library tests
        shell: bash
        env:
          RUST_BACKTRACE: full
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          log=/tmp/freya-lib-run.log
          set +e
          timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --lib -- --test-threads=1 --nocapture 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Freya library runtime diagnostic"
            grep -nE -B6 -A18 'test .* \.\.\. FAILED|panicked at|thread .* panicked|failures:|test result: FAILED|assertion|Error:|error:|signal:|SIG[A-Z]+|killed|timeout' "$log" | tail -n 500 || true
            echo "::endgroup::"
            {
              echo "## Freya library test execution failed"
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              tail -n 500 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Freya library test execution failed::cargo test --lib exited with status $status. See the diagnostic group and job summary."
            exit "$status"
          fi

      - name: Test Freya integration suites independently
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for file in Elephant/freya/tests/*.rs; do
            suite="$(basename "$file" .rs)"
            echo "::group::Freya suite: $suite"
            set +e
            timeout 180 cargo test --manifest-path Elephant/freya/Cargo.toml --test "$suite" -- --test-threads=1 2>&1 | tee "/tmp/freya-${suite}.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              if [ "$status" -eq 124 ]; then
                detail="suite timed out after 180 seconds"
              else
                detail="suite exited with status $status"
              fi
              python3 - "$suite" "$detail" "/tmp/freya-${suite}.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          suite, detail, filename = sys.argv[1:]
          raw = Path(filename).read_text(errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          lines = [ansi.sub('', line) for line in raw.splitlines()]
          markers = (
              ' FAILED', 'panicked at', 'failures:', 'test result: FAILED',
              'NotFound', 'assertion ', 'Error:', 'error[E', 'error:'
          )
          interesting = []
          for index, line in enumerate(lines):
              if any(marker in line for marker in markers):
                  interesting.extend(lines[max(0, index - 2):min(len(lines), index + 5)])
          if not interesting:
              interesting = lines[-30:]
          compact = []
          seen = set()
          for line in interesting:
              if line not in seen:
                  compact.append(line)
                  seen.add(line)
          message = detail + '\n' + '\n'.join(compact[-60:])
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Freya suite {suite}::{escaped}')
          PY
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "Freya integration failures: $failures"
            exit 1
          fi

  macos-check:
    name: Freya macOS compile
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya shell and native vault dialog on macOS
        run: cargo check --manifest-path Elephant/freya/Cargo.toml
