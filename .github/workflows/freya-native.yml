name: Freya native shell

on:
  push:
    branches:
      - nsb/freya-native-migration
  pull_request:
    paths:
      - "Elephant/freya/**"
      - "Elephant/crates/muya-core/**"
      - "Elephant/backend/knowledge-core/**"
      - ".github/workflows/freya-native.yml"

permissions:
  contents: read

jobs:
  check-and-test:
    name: Freya check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Elephant/freya -> target

      - name: Check Freya shell
        run: cargo check --manifest-path Elephant/freya/Cargo.toml

      - name: Test Freya shell
        run: cargo test --manifest-path Elephant/freya/Cargo.toml -- --test-threads=1
