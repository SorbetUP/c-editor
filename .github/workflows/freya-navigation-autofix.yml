name: Freya navigation autofix

on:
  push:
    branches:
      - parallel/freya-navigation-parity

permissions:
  contents: write

jobs:
  patch-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/freya-navigation-parity

      - name: Replace unsupported global pointer-up handlers
        shell: python
        run: |
          from pathlib import Path
          path = Path('Elephant/freya/src/app/navigation.rs')
          source = path.read_text()
          old = '.on_global_pointer_up('
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 {old!r} occurrences, found {count}')
          path.write_text(source.replace(old, '.on_global_pointer_press('))

      - name: Commit surgical API correction
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Elephant/freya/src/app/navigation.rs
          git commit -m 'fix(freya): use global pointer press for drag release'
          git push origin HEAD:parallel/freya-navigation-parity
