name: Final Freya Note integration

on:
  push:
    branches: [nsb/freya-native-migration]
    paths:
      - '.github/workflows/freya-note-final-integration.yml'
      - 'tools/freya-note-finalize.py'
      - 'tools/freya-note-finalize-test-fix.py'
      - 'tools/freya-note-core-finalize.py'
      - 'Elephant/crates/muya-core/src/edit/cross_selection.rs'
      - 'Elephant/freya/tests/editor_cross_wrapper_freya_testing.rs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-freya-note-integration
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: nsb/freya-native-migration
          fetch-depth: 0

      - name: Fast-forward migration branch
        run: git pull --ff-only origin nsb/freya-native-migration

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt,clippy

      - name: Install Freya graphical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev libegl-dev libwayland-dev libgles-dev python3-pil

      - name: Apply canonical editor cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/freya-note-core-finalize.py
          python3 tools/freya-note-finalize.py
          python3 tools/freya-note-finalize-test-fix.py
          cargo fmt --manifest-path Elephant/crates/muya-core/Cargo.toml
          cargo fmt --manifest-path Elephant/freya/Cargo.toml
          if grep -nEi 'not rendered|non rendu|non rendue|fn unsupported_block\(' Elephant/freya/src/app/editor_view.rs; then
            echo 'Unsupported production Markdown renderer placeholder remains.' >&2
            exit 1
          fi
          if grep -n 'Err(EditorError::Edit(EditError::CrossNodeSelection))' Elephant/freya/src/editor.rs; then
            echo 'Elephant cross-node paste fallback remains after Muya cutover.' >&2
            exit 1
          fi
          git diff --check

      - name: Verify vendored Muya engine
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Elephant/crates/muya-core/Cargo.toml -- --check
          cargo test --manifest-path Elephant/crates/muya-core/Cargo.toml --all-targets
          cargo clippy --manifest-path Elephant/crates/muya-core/Cargo.toml --all-targets -- -D warnings

      - name: Verify native Freya Note surface
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          set -euo pipefail
          cargo check --manifest-path Elephant/freya/Cargo.toml --all-targets
          for test in \
            editor_cross_wrapper_freya_testing \
            editor_atomic_inline_freya_testing \
            editor_structured_markdown_freya_testing \
            editor_image_markdown_freya_testing \
            editor_link_freya_testing \
            editor_keyboard_freya_testing \
            editor_lifecycle_freya_testing \
            editor_undo_redo_freya_testing \
            editor_rich_interactions_freya_testing \
            editor_toolbar_parity \
            muya_note_lifecycle_freya_testing \
            muya_tauri_structural_parity
          do
            cargo test --manifest-path Elephant/freya/Cargo.toml --test "$test" -- --test-threads=1 --nocapture
          done

      - name: Validate graphical evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = [
              Path('/tmp/elephant-freya-note-structured.png'),
              Path('/tmp/elephant-freya-note-image.png'),
          ]
          for path in paths:
              if not path.is_file() or path.stat().st_size < 1024:
                  raise SystemExit(f'missing/degenerate graphical evidence: {path}')
              image = Image.open(path).convert('RGBA')
              if image.width < 100 or image.height < 100:
                  raise SystemExit(f'degenerate graphical dimensions {path}: {image.size}')
              colors = image.getcolors(maxcolors=image.width * image.height) or []
              if len(colors) < 8:
                  raise SystemExit(f'visually degenerate evidence {path}: {len(colors)} colors')
              print(path, image.size, path.stat().st_size, len(colors))
          PY

      - name: Commit final verified Note integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Elephant/crates/muya-core/src/edit/cross_selection.rs \
            Elephant/crates/muya-core/src/edit/mod.rs \
            Elephant/crates/muya-core/src/edit/command.rs \
            Elephant/crates/muya-core/src/edit/paste_nested.rs \
            Elephant/crates/muya-core/src/edit/paste_nested_structured.rs \
            Elephant/freya/src/editor.rs \
            Elephant/freya/src/app.rs \
            Elephant/freya/src/app/editor_view.rs \
            Elephant/freya/src/app/editor_image_preview.rs \
            Elephant/freya/tests/editor_cross_wrapper_freya_testing.rs \
            Elephant/freya/tests/editor_image_markdown_freya_testing.rs
          git rm -- \
            .github/workflows/freya-note-final-integration.yml \
            tools/freya-note-core-finalize.py \
            tools/freya-note-finalize.py \
            tools/freya-note-finalize-test-fix.py
          git diff --cached --check
          git commit -m 'fix(freya-note): finalize native Muya editor integration'
          git pull --rebase origin nsb/freya-native-migration
          git push origin HEAD:nsb/freya-native-migration
