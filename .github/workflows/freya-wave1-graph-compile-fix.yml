name: Freya wave1 graph compile fix

on:
  push:
    branches:
      - parallel/freya-parity-integration-wave1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave1-graph-compile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: parallel/freya-parity-integration-wave1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - name: Replace removed Freya 0.4 global release handler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Elephant/freya/src/app/graph_canvas.rs')
          text = p.read_text()
          old = '.on_global_pointer_up(move |event: Event<PointerEventData>| {'
          new = '.on_global_pointer_press(move |event: Event<PointerEventData>| {'
          if text.count(old) != 1:
              raise SystemExit(f'graph pointer-release anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rustfmt --edition 2021 Elephant/freya/src/app/graph_canvas.rs
          git rm .github/workflows/freya-wave1-graph-compile-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Elephant/freya/src/app/graph_canvas.rs
          git diff --cached --check
          git commit -m 'fix(freya): use global pointer press to end graph drag [wave1-graph-compile]'
          git push origin HEAD:parallel/freya-parity-integration-wave1
