name: Freya wave1 integration seam fix

on:
  push:
    branches:
      - parallel/freya-parity-integration-wave1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave1-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/freya-parity-integration-wave1
          fetch-depth: 0

      - name: Apply deterministic integration seams
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          library = Path('Elephant/freya/src/app/library.rs')
          text = library.read_text()
          old = '''pub(super) fn main_content(state: State<ShellState>) -> Element {\n    let snapshot = state.read().clone();\n    let showing_library ='''
          new = '''pub(super) fn main_content(state: State<ShellState>) -> Element {\n    let snapshot = state.read().clone();\n    if let Some(panel) = drawing::active_panel(state) {\n        return panel;\n    }\n    let showing_library ='''
          if text.count(old) != 1:
              raise SystemExit(f'library seam anchor count={text.count(old)}; refusing ambiguous rewrite')
          library.write_text(text.replace(old, new, 1))

          app = Path('Elephant/freya/src/app.rs')
          text = app.read_text()
          old = '''            crate::library_contract::CreateAction::Folder => vault\n                .create_folder(Some(self.library.current_path.as_str().to_string()))\n                .map(|_| ()),'''
          new = '''            crate::library_contract::CreateAction::Folder => {\n                let parent = self.library.current_path.as_str().trim_matches('/');\n                let relative_path = if parent.is_empty() {\n                    "New Folder".to_string()\n                } else {\n                    format!("{parent}/New Folder")\n                };\n                vault.create_folder(Some(relative_path)).map(|_| ())\n            }'''
          if text.count(old) != 1:
              raise SystemExit(f'folder-create anchor count={text.count(old)}; refusing ambiguous rewrite')
          app.write_text(text.replace(old, new, 1))
          PY

          git rm .github/workflows/freya-wave1-integration-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Elephant/freya/src/app.rs Elephant/freya/src/app/library.rs
          git diff --cached --check
          git commit -m 'chore(integration): wire drawing surface and preserve folder creation [wave1-fix]'
          git push origin HEAD:parallel/freya-parity-integration-wave1
