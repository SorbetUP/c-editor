name: Freya wave1 rustfmt integration

on:
  push:
    branches:
      - parallel/freya-parity-integration-wave1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave1-rustfmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: parallel/freya-parity-integration-wave1
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt

      - name: Rustfmt exactly the Rust files changed by wave 1
        shell: bash
        run: |
          set -euo pipefail
          base=a49531551dcb7a1e9178601edb36f98bbe4b7f28
          mapfile -t files < <(
            git diff --diff-filter=ACMR --name-only "$base" HEAD -- \
              ':(glob)Elephant/freya/**/*.rs' \
              ':(glob)Elephant/crates/muya-core/**/*.rs' \
              ':(glob)Elephant/backend/knowledge-core/**/*.rs'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No changed Rust files in wave 1.'
          else
            printf 'rustfmt %s\n' "${files[@]}"
            rustfmt --edition 2021 "${files[@]}"
          fi

          git rm .github/workflows/freya-wave1-rustfmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Elephant/freya Elephant/crates/muya-core Elephant/backend/knowledge-core || true
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No rustfmt changes required.'
            exit 0
          fi
          git commit -m 'style(freya): rustfmt integrated parity wave [wave1-rustfmt]'
          git push origin HEAD:parallel/freya-parity-integration-wave1
