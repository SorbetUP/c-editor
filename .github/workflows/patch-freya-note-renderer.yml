name: One-shot Freya Note final renderer integration

on:
  push:
    branches: [nsb/freya-native-migration]
    paths:
      - '.github/workflows/patch-freya-note-renderer.yml'
      - 'tools/freya-note-finalize.py'
  pull_request_target:
    branches: [nsb/freya-native-migration]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-freya-note-final-renderer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: nsb/freya-native-migration
          fetch-depth: 0

      - name: Fast-forward migration branch
        run: git pull --ff-only origin nsb/freya-native-migration

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt,clippy

      - name: Install Freya Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6-dev libfontconfig1-dev libegl-dev libwayland-dev libgles-dev python3-pil

      - name: Apply final Note renderer patch
        run: |
          set -euo pipefail
          python3 tools/freya-note-finalize.py
          cargo fmt --manifest-path Elephant/freya/Cargo.toml
          allowed='^(Elephant/freya/src/app.rs|Elephant/freya/src/app/editor_view.rs|Elephant/freya/src/app/editor_image_preview.rs|Elephant/freya/tests/editor_image_markdown_freya_testing.rs|tools/freya-note-finalize.py|.github/workflows/patch-freya-note-renderer.yml)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatter changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if grep -nEi 'not rendered|non rendu|non rendue|fn unsupported_block\(' Elephant/freya/src/app/editor_view.rs; then
            echo 'Unsupported Markdown renderer placeholder remains.' >&2
            exit 1
          fi

      - name: Verify canonical Muya core mirror
        run: |
          set -euo pipefail
          cargo test --manifest-path Elephant/crates/muya-core/Cargo.toml --all-targets

      - name: Verify Freya Note production adapter
        env:
          RUST_BACKTRACE: full
        run: |
          set -euo pipefail
          cargo check --manifest-path Elephant/freya/Cargo.toml --all-targets
          for test in \
            editor_atomic_inline_freya_testing \
            editor_structured_markdown_freya_testing \
            editor_image_markdown_freya_testing \
            editor_link_freya_testing \
            editor_keyboard_freya_testing \
            editor_lifecycle_freya_testing \
            editor_undo_redo_freya_testing \
            editor_rich_interactions_freya_testing \
            editor_toolbar_parity \
            muya_note_lifecycle_freya_testing \
            muya_tauri_structural_parity
          do
            cargo test --manifest-path Elephant/freya/Cargo.toml --test "$test" -- --test-threads=1 --nocapture
          done

      - name: Validate graphical evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ('elephant-freya-note-structured.png', 'elephant-freya-note-image.png'):
              path = Path('/tmp') / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing graphical evidence: {path}')
              image = Image.open(path).convert('RGBA')
              if image.width < 100 or image.height < 100:
                  raise SystemExit(f'degenerate graphical evidence {path}: {image.size}')
              colors = image.getcolors(maxcolors=image.width * image.height) or []
              if len(colors) < 8:
                  raise SystemExit(f'visually degenerate evidence {path}: {len(colors)} colors')
              print(path, image.size, len(colors))
          PY

      - name: Commit verified renderer and remove one-shot machinery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            Elephant/freya/src/app.rs \
            Elephant/freya/src/app/editor_view.rs \
            Elephant/freya/src/app/editor_image_preview.rs \
            Elephant/freya/tests/editor_image_markdown_freya_testing.rs
          git rm -- .github/workflows/patch-freya-note-renderer.yml tools/freya-note-finalize.py
          git diff --cached --check
          git commit -m 'fix(freya): finalize native Muya Note rendering'
          git pull --rebase origin nsb/freya-native-migration
          git push origin HEAD:nsb/freya-native-migration
