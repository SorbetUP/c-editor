name: Sync Muya emoji catalog

on:
  push:
    branches: [nsb/freya-native-migration]
    paths:
      - '.github/workflows/sync-muya-emoji-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mirror exact Tauri Muya emoji catalog
        shell: bash
        run: |
          set -euo pipefail
          src='Elephant/frontend/src/muya/lib/ui/emojis/emojisJson.json'
          dst='Elephant/crates/muya-core/data/muya-emojis.json'
          test -s "$src"
          mkdir -p "$(dirname "$dst")"
          cp "$src" "$dst"
          test "$(git hash-object "$src")" = "$(git hash-object "$dst")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(muya): mirror exact Tauri emoji catalog'
          git pull --rebase origin nsb/freya-native-migration
          git push origin HEAD:nsb/freya-native-migration
