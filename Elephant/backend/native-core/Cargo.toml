[package]
name = "elephantnote-native-core"
version = "0.1.0"
description = "Shared pure Rust backend contracts for Elephant native shells"
license = "MIT"
edition = "2021"
rust-version = "1.91"

[dependencies]
pulldown-cmark = "0.13"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
