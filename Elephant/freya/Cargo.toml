[package]
name = "elephant-freya"
version = "0.1.0"
description = "Freya editor adapter for Elephant"
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1"
elephant-native-core = { package = "elephantnote-native-core", path = "../backend/native-core" }
elephantnote-knowledge-core = { path = "../backend/knowledge-core" }
elephant-draw = { path = "../vendor/Draw" }
elephant-note = { path = "../vendor/Note" }
freya = { version = "0.4.1", features = ["sdk"] }
futures-timer = "3"
muya-core = { path = "../crates/muya-core" }
notify = "6"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
blake3 = "1.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rfd = "0.17.2"

[dev-dependencies]
freya-clipboard = "0.4.2"
freya-testing = "0.4.1"
tokio = { version = "1", features = ["rt", "time"] }
