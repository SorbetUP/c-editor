[package]
name = "elephant-freya"
version = "0.1.0"
description = "Native Freya migration shell for Elephant"
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ElephantFreya"
path = "src/main.rs"

[dependencies]
freya = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
freya-testing = "0.4.1"
